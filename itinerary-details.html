<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Details - Roam Together Tours</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ADDED: Leaflet CSS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/itinerary-details.css">
</head>
<body>

    <div id="mobile-container">

        <header>
            <button class="back-btn" id="back-btn" aria-label="Go back">
                <i class="fas fa-arrow-left"></i>
            </button>
            <img src="./public/logo.png" alt="Roam Together Tours logo">
            
            <!-- NEW: Notification Bell -->
            <a href="notifications.html" class="notification-btn">
                <i class="fas fa-bell"></i>
                <span class="notification-dot"></span>
            </a>
        </header>

        <main class="content details-content" id="main-content">
            <div id="itinerary-schedule" class="schedule-container">
                <!-- Dynamic items will go here -->
            </div>

            <button id="add-itinerary-item" class="add-activity-btn">
                <i class="fas fa-plus"></i> Add Activity
            </button>
            <!-- Hidden fallback inputs for JS compatibility -->
            <input type="text" id="item-input" style="display:none;">
            <select id="day-select" style="display:none;">
            <option value="1">Day 1</option>
            </select>
            <button id="add-item-btn" style="display:none;">hidden-fallback</button>
            <div id="itinerary-container"></div>
        </main>

        <!-- NEW: Add Activity Modal -->
        <div id="activity-modal" class="modal-overlay hidden">
            <div class="modal-content" style="text-align: left;">
                <h3 style="margin-top: 0; text-align: center;">Add New Activity</h3>
                
                <div class="input-group">
                    <label style="font-size: 0.8rem; font-weight: bold; color: #7f8c8d;">Select Day</label>
                    <select id="modal-day-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                        <option value="1">Day 1</option>
                        <option value="2">Day 2</option>
                        <option value="3">Day 3</option>
                    </select>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label style="font-size: 0.8rem; font-weight: bold; color: #7f8c8d;">Activity Type</label>
                    <div class="type-selector" style="display: flex; gap: 10px; margin-top: 5px;">
                        <button class="type-btn active" data-type="accommodation" onclick="selectType(this)">
                            <i class="fas fa-bed"></i>
                        </button>
                        <button class="type-btn" data-type="restaurant" onclick="selectType(this)">
                            <i class="fas fa-utensils"></i>
                        </button>
                        <button class="type-btn" data-type="event" onclick="selectType(this)">
                            <i class="fas fa-calendar-alt"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label style="font-size: 0.8rem; font-weight: bold; color: #7f8c8d;">Activity Name</label>
                    <input type="text" id="modal-activity-name" placeholder="e.g., Hotel Arts, The Keg..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                </div>

                <div class="modal-actions" style="margin-top: 20px;">
                    <button class="modal-btn cancel" id="cancel-activity">Cancel</button>
                    <button class="modal-btn confirm" id="save-activity" style="background-color: #2C3E50; color: white;">Add</button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="map.html" class="nav-item">
                <i class="fas fa-globe-americas"></i>
                <span>Maps</span>
            </a>
            <a href="favourites.html" class="nav-item">
                <i class="far fa-heart"></i>
                <span>Favourites</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-sliders-h"></i>
                <span>Settings</span>
            </a>
        </nav>

    </div>

    <!-- ADDED: Leaflet JS and Map Initialization -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
    <script src="itinerary-details.js"></script>
    <script src="search.js"></script>
</body>
</html>
