<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel App - Flights</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>PARIS</h1>
        </header>
        <main>
            <div class="date-header">2025, Oct 13 - 16</div>
            <div class="flight-list">
                <div class="flight-card">
                    <div class="flight-times">6:15 AM → 10:35 AM</div>
                    <div class="flight-duration">8h 20m</div>
                    <div class="flight-airports">CDG-YYC</div>
                    <div class="flight-price">CA $1,824</div>
                </div>
                <div class="flight-card">
                    <div class="flight-times">5:30 PM → 1:00 PM</div>
                    <div class="flight-duration">12h 17m</div>
                    <div class="flight-airports">CDG-YYC</div>
                    <div class="flight-price">CA $1,398</div>
                </div>
                <div class="flight-card">
                    <div class="flight-times">1:50 PM → 1:50 PM</div>
                    <div class="flight-duration">13h</div>
                    <div class="flight-airports">CDG-YYC</div>
                    <div class="flight-price">CA $1,942</div>
                </div>
            </div>
        </main>
        <nav class="main-nav">
            <a href="#">🔍</a>
            <a href="#">🗺️</a>
            <a href="#">✈️</a>
            <a href="#">❤️</a>
            <a href="#">⚙️</a>
        </nav>
    </div>
</body>
</html>
