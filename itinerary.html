<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roam Together Tours</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/search.css">
    <link rel="stylesheet" href="style/destination.css">
    <link rel="stylesheet" href="style/flight-results.css">
    <link rel="stylesheet" href="style/delete-mode.css">
</head>
<body>

    <div id="mobile-container">

        <header>
            <img src="./public/logo.png" alt="A placeholder image of a travel destination">
        </header>
        <div class="tab-bar">
            <a href="itinerary.html" class="tab-btn" id="tab-itinerary">Itinerary</a>
            <a href="share.html" class="tab-btn" id="tab-share">Share</a>
            <a href="search.html" class="tab-btn" id="tab-search">Search</a>
        </div>
        <main class="content" id="main-content">
            <div id="itinerary-list" style="width: 100%; display: flex; flex-direction: column; gap: 15px;"></div>

            <a href="search.html" class="add-trip-box">
                <span class="add-trip-label">Start a new tour</span>
            </a>
        </main>

        <!-- NEW: Delete Confirmation FAB (Bottom Left) -->
        <button class="fab-btn delete-confirm-btn hidden" id="delete-confirm-fab">
            <i class="fas fa-trash"></i>
        </button>

        <div class="fab-container">
            <button class="fab-btn" id="fab-btn">
                <i class="fas fa-plus"></i>
            </button>
            <div class="fab-menu" id="fab-menu">
                <!-- Added ID for JS access -->
                <a href="#" class="fab-menu-item" id="btn-edit-mode">
                    <i class="fas fa-edit"></i>
                    <span>Edit itinerary</span>
                </a>
                <!-- Added ID for JS access -->
                <a href="#" class="fab-menu-item" id="btn-delete-mode">
                    <i class="fas fa-trash"></i>
                    <span>Delete itinerary</span>
                </a>
            </div>
        </div>

        <!-- NEW: Custom Confirmation Modal -->
        <div id="delete-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h3>Delete Trips?</h3>
                <p>Are you sure you want to remove the selected trips? This action cannot be undone.</p>
                <div class="modal-actions">
                    <button class="modal-btn cancel" id="modal-cancel">Cancel</button>
                    <button class="modal-btn delete" id="modal-confirm">Delete</button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="map.html" class="nav-item">
                <i class="fas fa-globe-americas"></i>
                <span>Maps</span>
            </a>
            <a href="#" class="nav-item">
                <i class="far fa-heart"></i>
                <span>Favourites</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-sliders-h"></i>
                <span>Settings</span>
            </a>
        </nav>

    </div>

    <script src="script.js"></script>
    <script src="itinerary.js"></script>

</body>
</html>
