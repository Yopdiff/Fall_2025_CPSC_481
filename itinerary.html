<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roam Together Tours</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/search.css">
    <link rel="stylesheet" href="style/destination.css">
    <link rel="stylesheet" href="style/flight-results.css">
</head>
<body>

    <div id="mobile-container">

        <header>
            <img src="./public/logo.png" alt="A placeholder image of a travel destination">
        </header>
        <div class="tab-bar">
            <a href="itinerary.html" class="tab-btn" id="tab-itinerary">Itinerary</a>
            <a href="share.html" class="tab-btn" id="tab-share">Share</a>
            <a href="search.html" class="tab-btn" id="tab-search">Search</a>
        </div>
        <main class="content" id="main-content">
            <div id="itinerary-list" style="width: 100%; display: flex; flex-direction: column; gap: 15px;"></div>

            <a href="search.html" class="add-trip-box">
                <span class="add-trip-label">Start a new tour</span>
            </a>
        </main>

        <div class="fab-container">
            <button class="fab-btn" id="fab-btn">
                <i class="fas fa-plus"></i>
            </button>
            <div class="fab-menu" id="fab-menu">
                <a href="#" class="fab-menu-item">
                    <i class="fas fa-edit"></i>
                    <span>Edit itinerary</span>
                </a>
                <a href="#" class="fab-menu-item">
                    <i class="fas fa-trash"></i>
                    <span>Delete itinerary</span>
                </a>
            </div>
        </div>
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-globe-americas"></i>
                <span>Maps</span>
            </a>
            <a href="#" class="nav-item">
                <i class="far fa-heart"></i>
                <span>Favourites</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-sliders-h"></i>
                <span>Settings</span>
            </a>
        </nav>

    </div>

    <script src="script.js"></script>
    <script src="itinerary.js"></script>

</body>
</html>
