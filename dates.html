<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel App - Dates</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>PARIS</h1>
        </header>
        <main>
            <div class="date-inputs">
                <div>
                    <label for="from">From:</label>
                    <input type="text" id="from" class="sketch-input" value="2025, Oct 13">
                </div>
                <div>
                    <label for="to">To:</label>
                    <input type="text" id="to" class="sketch-input" value="2025, Oct 16">
                </div>
            </div>

            <div class="calendar">
                <div class="calendar-header">← 2025, OCT →</div>
                <div class="calendar-grid">
                    <span class="day-name">Sun</span><span class="day-name">Mon</span><span class="day-name">Tue</span><span class="day-name">Wed</span><span class="day-name">Thu</span><span class="day-name">Fri</span><span class="day-name">Sat</span>
                    <span></span><span></span><span></span><span>1</span><span>2</span><span>3</span><span>4</span>
                    <span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span>
                    <span>12</span><a href="flights.html" class="day selected start-range">13</a><a href="flights.html" class="day range">14</a><a href="flights.html" class="day range">15</a><a href="flights.html" class="day selected end-range">16</a><span>17</span><span>18</span>
                    <span>19</span><span>20</span><span>21</span><span>22</span><span>23</span><span>24</span><span>25</span>
                    <span>26</span><span>27</span><span>28</span><span>29</span><span>30</span><span>31</span><span></span>
                </div>
            </div>
        </main>
        <nav class="main-nav">
            <a href="#">🔍</a>
            <a href="#">🗺️</a>
            <a href="#">✈️</a>
            <a href="#">❤️</a>
            <a href="#">⚙️</a>
        </nav>
    </div>
</body>
</html>
