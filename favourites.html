<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Trips – Roam Together Tours</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div id="mobile-container">

        <!-- Header -->
        <header class="screen-header">
            <div class="logo-title">
                <img src="public/logo.png" alt="Roam Together Tours" class="logo-small">
                <span>Saved trips</span>
            </div>
        </header>

        <main class="content">

            <!-- Segmented control: Saved vs Offline Itinerary -->
            <div class="segmented-tabs">
                <button id="tab-saved" class="seg-tab active">Saved trips</button>
                <button id="tab-offline" class="seg-tab">Offline itinerary</button>
            </div>

            <!-- Saved trips list -->
            <section id="saved-view" class="fav-section">
                <div id="saved-trips-list" class="fav-list">
                    <!-- Filled by favourites.js -->
                </div>
            </section>

            <!-- Offline itineraries -->
            <section id="offline-view" class="fav-section hidden">
                <p class="empty-message">
                    You have not downloaded any itineraries yet.
                </p>
                <p class="hint-text">
                    Use “Download itinerary” from your trip to make it available here for offline use.
                </p>
                <div id="offline-list" class="fav-list"></div>
            </section>

        </main>

        <!-- Bottom navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="map.html" class="nav-item">
                <i class="fas fa-globe-americas"></i>
                <span>Maps</span>
            </a>
            <a href="favourites.html" class="nav-item active">
                <i class="far fa-heart"></i>
                <span>Favourites</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-sliders-h"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <script src="script.js"></script>
    <script src="favourites.js"></script>
</body>
</html>
